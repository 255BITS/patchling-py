name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Run 28758499337 (2026-07-05, "Bump version: 0.8.0 → 0.8.1") built the site
# and uploaded the artifact, then failed in "Deploy to GitHub Pages". That
# push landed three minutes after another successful Pages deploy, which is
# the usual "deployment already in progress" rejection from the Pages API.
# Queue deploys instead of overlapping them, and retry once if Pages is still
# finishing the previous deployment after this workflow starts.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install "mkdocs-material==9.6.22"

      - name: Build site
        run: mkdocs build --strict --site-dir public

      - name: Ensure CNAME is set
        run: echo "gptdiff.255labs.xyz" > public/CNAME

      # gptdiff.255labs.xyz -> patchling.app/py/ (same page, query and #anchor;
      # unknown paths go to /py/). Off until the repo variable
      # GPTDIFF_REDIRECT_TO_PATCHLING_APP is "true". Set it only once
      # https://patchling.app/py/ is live (255BITS/patchling PR #13 merged and
      # its Pages build settings applied). Unset it to serve the docs here again.
      - name: Replace pages with redirects to patchling.app/py/
        if: vars.GPTDIFF_REDIRECT_TO_PATCHLING_APP == 'true'
        run: python scripts/gptdiff_redirect_stubs.py public https://patchling.app/py/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait for an in-progress Pages deployment to finish
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry Deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
