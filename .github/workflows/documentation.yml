name: Deploy Documentation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Run 28758499337 (2026-07-05, "Bump version: 0.8.0 → 0.8.1") built the site
# and uploaded the artifact, then failed in "Deploy to GitHub Pages". That
# push landed three minutes after another successful Pages deploy, which is
# the usual "deployment already in progress" rejection from the Pages API.
# Queue deploys instead of overlapping them, and retry once if Pages is still
# finishing the previous deployment after this workflow starts.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Pages
        if: github.repository == '255BITS/patchling-py' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install "mkdocs-material==9.6.22"

      - name: Build site
        run: mkdocs build --strict --site-dir public

      - name: Record the site domain and source revision
        run: |
          printf '%s\n' 'gptdiff.255labs.xyz' > public/CNAME
          printf '{"revision":"%s"}\n' "$(git rev-parse HEAD)" > public/pages-revision.json

      - name: Upload artifact
        if: github.repository == '255BITS/patchling-py' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.repository == '255BITS/patchling-py' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait for an in-progress Pages deployment to finish
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry Deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Verify the public documentation revision
        shell: bash
        run: |
          url="https://gptdiff.255labs.xyz/pages-revision.json"
          for attempt in {1..12}; do
            if revision=$(curl --silent --show-error --fail --location --max-time 10 \
              "$url?revision=$GITHUB_SHA&attempt=$attempt" | jq -er '.revision') && [[ "$revision" == "$GITHUB_SHA" ]]; then
              printf 'Public documentation serves %s\n' "$revision"
              exit 0
            fi
            sleep 5
          done
          printf 'Public documentation did not confirm revision %s\n' "$GITHUB_SHA" >&2
          exit 1
